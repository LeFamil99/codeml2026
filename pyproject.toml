[project]
name = "l2c-review"
version = "0.1.0"
description = "Automated verification of rebar shop drawings against L2C structural plans"
requires-python = ">=3.10"
dependencies = [
    "pymupdf==1.28.2",      # primary engine: 58x faster than pdfplumber, normalises coords (PLAN S3.1-3.2)
    "numpy>=1.26",
    "scipy>=1.11",        # global callout<->symbol assignment (PLAN SS6.2)
    "pillow>=10.1",
    "pydantic>=2.0",        # Appendix-A schema validation (mandatory per consignes)
    "reportlab>=4.0",       # PDF report (mandatory per consignes)
    "openpyxl>=3.1",        # reads the *_dismatch.xlsx answer key (MIT)
]

[project.optional-dependencies]
app = ["streamlit>=1.65"]
da = ["rapidocr==3.9.2", "onnxruntime==1.30.0", "opencv-python-headless==5.0.0.93"]
dev = ["pytest>=8.0", "pdfplumber==0.11.10"]   # pdfplumber kept ONLY as a test cross-check
notebook = ["notebook>=7", "nbconvert>=7", "matplotlib>=3.8", "pandas>=2.0"]

[project.scripts]
l2c = "l2c.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
